<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Desa Mandiri</title><link rel="icon" href="assets/ui/logo/logo_icon_32.png">
<link rel="stylesheet" href="theme.css"></head><body class="skin">
<div id="top"><span id="res"></span><span id="time"></span>
<span id="speedbar"><span class="lbl">Kecepatan: </span><button data-s="0">Jeda</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="3">3x</button><button data-s="4">4x</button></span>
<span id="buildbar"></span>
<span id="zoombar"><span class="lbl">Zoom: </span><button id="zout">−</button><button id="zin">+</button></span> <button id="techbtn" title="Riset">🔬<span class="lbl"> Riset</span></button><button id="marketbtn" title="Pasar">🛒<span class="lbl"> Pasar</span></button><button id="tujuanbtn" title="Tujuan Desa">🏛️<span class="lbl"> Tujuan</span></button><button id="achbtn" title="Pencapaian">🏅<span class="lbl"> Pencapaian</span></button> <button id="save" title="Simpan">💾<span class="lbl"> Simpan</span></button><button id="load" title="Muat">📂<span class="lbl"> Muat</span></button><button id="reset" title="Baru">🆕<span class="lbl"> Baru</span></button><button id="drawerbtn" title="Buka/tutup panel samping">☰ Panel</button><button id="menubtn" title="Menu">☰<span class="lbl"> Menu</span></button><button id="mutebtn" title="Bisukan / nyalakan suara">🔊</button></div>
<div id="wrap"><div id="cwrap"><canvas id="c"></canvas><div id="warnbar"></div></div><div id="side">
<h3>Prioritas Kerja</h3><div id="prio"></div><h3>Era</h3><div id="era" style="font-size:12px"></div><h3>Misi</h3><div id="quest"></div><div id="wish" style="font-size:12px"></div><h3>Ringkasan Kemarin</h3><div id="summary" style="font-size:12px"></div><h3>Penduduk</h3><div id="vil"></div><h3>Log Desa</h3><div id="log"></div></div></div>
<div id="modal" class="panel"></div><div id="tut" class="panel"></div><div id="vpanel" class="panel"></div><div id="techpanel" class="panel"></div><div id="market" class="panel"></div><div id="achpanel" class="panel"></div><div id="tujuanpanel" class="panel"></div><div id="toasts"></div>
<div id="menu"><div class="box" id="menuMain"><img class="logo" src="assets/ui/logo/logo_2x.png" alt="Desa Mandiri" onerror="this.outerHTML='<h1>Desa Mandiri</h1>'"><div class="sub">Bangun desamu, rawat penduduknya.</div>
<button class="big" id="btnNew">Main Baru</button><button class="big" id="btnContinue">Lanjutkan</button><button class="big" id="btnSettings">Pengaturan</button></div>
<div class="box" id="menuSettings" style="display:none"><h1 style="font-size:28px">Pengaturan</h1>
<label><span id="lblMusik">Volume Musik</span> <input type="range" id="setMusik" min="0" max="100"></label><label><span id="lblEfek">Volume Efek</span> <input type="range" id="setEfek" min="0" max="100"></label>
<label><span id="lblSpeed">Kecepatan awal</span> <select id="setSpeed"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option></select></label>
<label><span id="lblLang">Bahasa</span> <select id="setLang"><option value="id">Bahasa Indonesia</option><option value="en" disabled>English (segera)</option></select></label>

<button class="big" id="btnBack">Kembali</button></div></div>
<script src="balance.js"></script><script src="cerita.js"></script><script src="tujuan.js"></script><script src="tema.js"></script><script src="assets.js"></script><script src="audio.js"></script><script src="tech.js"></script><script src="game.js"></script>
</body></html>
